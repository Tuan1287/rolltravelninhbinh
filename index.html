<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninh Bình Travel Roll - Vòng Quay Du Lịch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="anvat.js"></script>
    <script src="cafe.js"></script>
    <script src="khudiem.js"></script>
    <script src="luutru.js"></script>
    <script src="nhahang.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom wheel indicator arrow */
        .wheel-pointer {
            clip-path: polygon(100% 0, 0 50%, 100% 100%);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-900 font-extrabold text-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-compass"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">Ninh Bình Travel Roll</h1>
                    <p class="text-xs text-slate-400">Random Địa Điểm & Lịch Trình</p>
                </div>
            </div>

            <!-- Stats Badge -->
            <div class="hidden sm:flex items-center space-x-2 text-xs bg-slate-900/60 px-3 py-1.5 rounded-full border border-slate-700/60 text-slate-300">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="totalLocationsCount">0 địa điểm đã tải</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Wheel & Controls -->
        <section class="lg:col-span-7 flex flex-col items-center space-y-6">
            
            <!-- Category Tabs / Modes -->
            <div class="w-full bg-slate-800/60 p-1.5 rounded-2xl border border-slate-700/60 flex flex-wrap gap-1 text-sm">
                <button onclick="setMode('all')" id="tab-all" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl font-medium transition-all text-center bg-emerald-500 text-slate-950 font-semibold shadow-md">
                    Tất cả
                </button>
                <button onclick="setMode('khudiem')" id="tab-khudiem" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl font-medium transition-all text-center text-slate-300 hover:text-white hover:bg-slate-700/50">
                    🏰 Khu điểm
                </button>
                <button onclick="setMode('nhahang')" id="tab-nhahang" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl font-medium transition-all text-center text-slate-300 hover:text-white hover:bg-slate-700/50">
                    🍲 Nhà hàng
                </button>
                <button onclick="setMode('anvat')" id="tab-anvat" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl font-medium transition-all text-center text-slate-300 hover:text-white hover:bg-slate-700/50">
                    🍢 Ăn vặt
                </button>
                <button onclick="setMode('cafe')" id="tab-cafe" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl font-medium transition-all text-center text-slate-300 hover:text-white hover:bg-slate-700/50">
                    ☕ Cà phê
                </button>
                <button onclick="setMode('luutru')" id="tab-luutru" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl font-medium transition-all text-center text-slate-300 hover:text-white hover:bg-slate-700/50">
                    🏡 Lưu trú
                </button>
            </div>

            <!-- Wheel Section Container -->
            <div class="relative w-full max-w-sm sm:max-w-md aspect-square flex items-center justify-center p-4">
                <!-- Outer Ring Glow -->
                <div class="absolute inset-2 rounded-full bg-gradient-to-tr from-emerald-500/20 to-teal-500/20 blur-xl"></div>
                
                <!-- Pointer -->
                <div class="absolute top-2 z-20 w-8 h-8 -ml-4 left-1/2 flex justify-center drop-shadow-[0_4px_10px_rgba(0,0,0,0.5)]">
                    <div class="w-6 h-8 bg-amber-400 wheel-pointer rotate-90"></div>
                </div>

                <!-- Canvas Wheel -->
                <div class="relative w-full h-full rounded-full border-4 border-slate-700 shadow-2xl overflow-hidden bg-slate-800">
                    <canvas id="wheelCanvas" class="w-full h-full cursor-pointer"></canvas>
                </div>

                <!-- Center Spin Button -->
                <button id="spinBtn" onclick="spinWheel()" class="absolute z-30 w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-emerald-400 to-teal-300 hover:from-emerald-300 hover:to-teal-200 text-slate-950 font-black rounded-full shadow-2xl flex flex-col items-center justify-center border-4 border-slate-900 transition-all hover:scale-105 active:scale-95 group">
                    <i class="fa-solid fa-sync text-lg group-hover:rotate-180 transition-transform duration-500"></i>
                    <span class="text-xs uppercase tracking-wider font-extrabold mt-0.5">QUAY</span>
                </button>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-3 w-full max-w-md">
                <button onclick="spinWheel()" class="flex-1 py-3 px-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-dice text-lg"></i>
                    <span>Quay 1 Địa Điểm</span>
                </button>
                <button onclick="generateItinerary()" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-emerald-400 font-semibold border border-slate-700 rounded-xl flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Tạo Combo Nhanh</span>
                </button>
            </div>

        </section>

        <!-- Right Column: Itinerary Plans & Results -->
        <section class="lg:col-span-5 flex flex-col space-y-5">
            
            <!-- Plan Generator Header Tabs -->
            <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 shadow-xl">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-route text-emerald-400"></i>
                    <span>Gợi Ý Lịch Trình Nhanh</span>
                </h2>
                
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <button onclick="selectPlanTab('1N1D')" id="plan-1N1D" class="plan-tab py-2 px-3 text-xs font-bold rounded-xl border border-slate-700 bg-slate-700/50 text-emerald-400 text-center transition-all">
                        1 Ngày 1 Đêm
                    </button>
                    <button onclick="selectPlanTab('2N1D')" id="plan-2N1D" class="plan-tab py-2 px-3 text-xs font-bold rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-700/30 text-center transition-all">
                        2 Ngày 1 Đêm
                    </button>
                    <button onclick="selectPlanTab('3N2D')" id="plan-3N2D" class="plan-tab py-2 px-3 text-xs font-bold rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-700/30 text-center transition-all">
                        3 Ngày 2 Đêm
                    </button>
                </div>

                <button onclick="generateItineraryByPlan()" class="w-full py-2.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 font-medium text-sm rounded-xl border border-emerald-500/30 flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span id="planBtnLabel">Tạo Lịch Trình 1N1Đ Tự Động</span>
                </button>
            </div>

            <!-- Result Showcase Card -->
            <div class="bg-slate-800/80 p-5 rounded-2xl border border-slate-700 shadow-xl flex-grow flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                            <i class="fa-solid fa-star text-amber-400"></i>
                            <span id="resultTitle">Kết Quả Đã Quay</span>
                        </h2>
                        <span id="resultBadge" class="hidden text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                            May Mắn
                        </span>
                    </div>

                    <!-- Single Result Content -->
                    <div id="singleResultView" class="space-y-4">
                        <div class="p-4 rounded-xl bg-slate-900/60 border border-slate-700/60 text-center py-8">
                            <div class="w-12 h-12 mx-auto mb-3 rounded-full bg-slate-800 flex items-center justify-center text-slate-500">
                                <i class="fa-solid fa-gift text-xl"></i>
                            </div>
                            <p class="text-slate-400 text-sm">Nhấn <span class="text-emerald-400 font-semibold">QUAY</span> để chọn ngẫu nhiên địa điểm cho chuyến đi của bạn!</p>
                        </div>
                    </div>

                    <!-- Itinerary Multi-Result Content -->
                    <div id="itineraryResultView" class="hidden space-y-3 max-h-[380px] overflow-y-auto pr-1">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <!-- Footer Actions in Card -->
                <div id="resultActions" class="hidden pt-4 mt-4 border-t border-slate-700/60 flex justify-between items-center">
                    <button onclick="copyResultToClipboard()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1.5 transition-colors">
                        <i class="fa-regular fa-copy"></i>
                        <span>Sao chép kết quả</span>
                    </button>
                    <span id="copyToast" class="hidden text-xs text-emerald-400">Đã sao chép!</span>
                </div>
            </div>

        </section>
    </main>

    <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        <div class="max-w-6xl mx-auto px-4">
            Ninh Bình Travel Roll &copy; 2026 - Tự động tổng hợp từ dữ liệu du lịch địa phương
        </div>
    </footer>

    <script>
        // Fallback dataset in case external files are missing/empty
        const FALLBACK_DATA = {
            khudiem: [
                { name: "Tràng An", desc: "Di sản thế giới UNESCO, chèo thuyền ngắm hang động", category: "Khu điểm" },
                { name: "Tam Cốc - Bích Động", desc: "Cánh đồng lúa chín vàng thơ mộng bên dòng sông", category: "Khu điểm" },
                { name: "Hang Múa", desc: "Tọa độ check-in ngắm toàn cảnh Tam Cốc từ trên cao", category: "Khu điểm" },
                { name: "Chùa Bái Đính", desc: "Quần thể chùa lớn nhất Đông Nam Á", category: "Khu điểm" },
                { name: "Cố đô Hoa Lư", desc: "Kinh đô đầu tiên của nhà nước phong kiến Việt Nam", category: "Khu điểm" }
            ],
            nhahang: [
                { name: "Nhà hàng Đức Dê", desc: "Đặc sản thịt dê núi Ninh Bình chế biến đa dạng", category: "Nhà hàng" },
                { name: "Nhà hàng Thăng Long", desc: "Nổi tiếng với cơm cháy và thịt dê tươi ngon", category: "Nhà hàng" },
                { name: "Nhà hàng Hoàng Giang", desc: "Không gian rộng rãi sát bờ sông thơ mộng", category: "Nhà hàng" }
            ],
            anvat: [
                { name: "Cơm cháy Chà Bông", desc: "Món quà đặc sản giòn rụm đậm đà", category: "Ăn vặt" },
                { name: "Bánh trôi nước Ninh Bình", desc: "Bánh trôi nhân mật thơm ngọt vị truyền thống", category: "Ăn vặt" },
                { name: "Ốc núi Tam Điệp", desc: "Ốc giòn ngọt ăn kèm nước chấm gừng sả", category: "Ăn vặt" }
            ],
            cafe: [
                { name: "Chứa Cafe", desc: "Góc cafe chill mang phong cách hoài niệm", category: "Cà phê" },
                { name: "Bích Động Coffee", desc: "View cánh đồng và núi đá vôi siêu đẹp", category: "Cà phê" },
                { name: "An Cafe", desc: "Không gian yên tĩnh gần gũi thiên nhiên", category: "Cà phê" }
            ],
            luutru: [
                { name: "Tràng An Retreat", desc: "Homestay giữa thung lũng xanh mát", category: "Lưu trú" },
                { name: "Tam Cốc Garden Resort", desc: "Khu nghỉ dưỡng cao cấp hòa quyện với làng quê", category: "Lưu trú" },
                { name: "Emeralda Resort Gia Viễn", desc: "Resort chuẩn 5 sao mang nét kiến trúc Bắc Bộ", category: "Lưu trú" }
            ]
        };

        // Master Data Container
        let DATABASE = {
            khudiem: [],
            nhahang: [],
            anvat: [],
            cafe: [],
            luutru: []
        };

        let currentMode = 'all';
        let activePlan = '1N1D';
        let currentList = [];
        let isSpinning = false;
        let startAngle = 0;
        let currentResultText = "";

        function initData() {
            // Load from global variables provided by external js files or fallback
            DATABASE.khudiem = normalizeData(window.khudiemData || window.khudiem || FALLBACK_DATA.khudiem, "Khu điểm");
            DATABASE.nhahang = normalizeData(window.nhahangData || window.nhahang || FALLBACK_DATA.nhahang, "Nhà hàng");
            DATABASE.anvat = normalizeData(window.anvatData || window.anvat || FALLBACK_DATA.anvat, "Ăn vặt");
            DATABASE.cafe = normalizeData(window.cafeData || window.cafe || FALLBACK_DATA.cafe, "Cà phê");
            DATABASE.luutru = normalizeData(window.luutruData || window.luutru || FALLBACK_DATA.luutru, "Lưu trú");

            const total = DATABASE.khudiem.length + DATABASE.nhahang.length + DATABASE.anvat.length + DATABASE.cafe.length + DATABASE.luutru.length;
            document.getElementById('totalLocationsCount').innerText = `${total} địa điểm khả dụng`;

            updateCurrentList();
            drawWheel();
        }

        // Helper to standardize item format
        function normalizeData(dataArray, categoryDefault) {
            if (!Array.isArray(dataArray) || dataArray.length === 0) return [];
            return dataArray.map(item => {
                if (typeof item === 'string') {
                    return { name: item, desc: 'Địa điểm hấp dẫn tại Ninh Bình', category: categoryDefault };
                }
                return {
                    name: item.name || item.ten || item.title || 'Địa điểm không tên',
                    desc: item.desc || item.mota || item.address || item.diachi || 'Thông tin chi tiết đang cập nhật',
                    category: item.category || categoryDefault
                };
            });
        }

        function updateCurrentList() {
            if (currentMode === 'all') {
                currentList = [
                    ...DATABASE.khudiem,
                    ...DATABASE.nhahang,
                    ...DATABASE.anvat,
                    ...DATABASE.cafe,
                    ...DATABASE.luutru
                ];
            } else {
                currentList = DATABASE[currentMode] || [];
            }

            // Shuffle array slightly for visual variance
            if (currentList.length === 0) {
                currentList = FALLBACK_DATA.khudiem;
            }
        }

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2; // High DPI resolution
            canvas.height = rect.height * 2;
            drawWheel();
        }

        const colors = [
            '#10b981', '#06b6d4', '#3b82f6', '#6366f1', 
            '#8b5cf6', '#ec4899', '#f43f5e', '#f59e0b'
        ];

        function drawWheel() {
            if (!canvas.width) return;
            const numOptions = currentList.length;
            const arcSize = (2 * Math.PI) / numOptions;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numOptions; i++) {
                const angle = startAngle + i * arcSize;
                
                // Draw sector
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.lineTo(centerX, centerY);
                ctx.fill();

                // Stroke border
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold ' + (canvas.width / 25) + 'px "Plus Jakarta Sans"';
                ctx.translate(
                    centerX + Math.cos(angle + arcSize / 2) * (radius * 0.65),
                    centerY + Math.sin(angle + arcSize / 2) * (radius * 0.65)
                );
                ctx.rotate(angle + arcSize / 2 + Math.PI / 2);
                
                let text = currentList[i].name;
                if (text.length > 12) text = text.substring(0, 10) + '...';
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            }
        }

        function spinWheel() {
            if (isSpinning || currentList.length === 0) return;
            isSpinning = true;

            const spinAngleStart = Math.random() * 10 + 20;
            let spinTime = 0;
            const spinTimeTotal = Math.random() * 2000 + 3000;

            function rotate() {
                spinTime += 20;
                if (spinTime >= spinTimeTotal) {
                    stopRotateWheel();
                    return;
                }
                const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
                startAngle += (spinAngle * Math.PI / 180);
                drawWheel();
                requestAnimationFrame(rotate);
            }
            rotate();
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        function stopRotateWheel() {
            isSpinning = false;
            const numOptions = currentList.length;
            const degrees = (startAngle * 180 / Math.PI) % 360;
            const arcd = 360 / numOptions;
            
            // Pointer is at the top (270deg in standard canvas coords or 90deg offset)
            const index = Math.floor((360 - (degrees % 360) + 270) % 360 / arcd);
            const selected = currentList[index];

            displaySingleResult(selected);
        }

        function displaySingleResult(item) {
            document.getElementById('singleResultView').classList.remove('hidden');
            document.getElementById('itineraryResultView').classList.add('hidden');
            document.getElementById('resultBadge').classList.remove('hidden');
            document.getElementById('resultActions').classList.remove('hidden');

            document.getElementById('resultTitle').innerText = "Địa Điểm Trúng Thưởng";
            currentResultText = `${item.name} (${item.category}): ${item.desc}`;

            document.getElementById('singleResultView').innerHTML = `
                <div class="p-5 rounded-2xl bg-slate-900/90 border border-emerald-500/40 shadow-xl text-center space-y-3">
                    <span class="inline-block px-3 py-1 bg-emerald-500/20 text-emerald-400 font-bold text-xs rounded-full border border-emerald-500/30 uppercase">
                        ${item.category || 'Ninh Bình'}
                    </span>
                    <h3 class="text-2xl font-black text-white leading-tight">${item.name}</h3>
                    <p class="text-slate-300 text-sm leading-relaxed">${item.desc}</p>
                    <div class="pt-2 flex justify-center gap-2">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' Ninh Bình')}" target="_blank" class="text-xs px-3 py-2 bg-slate-800 hover:bg-slate-700 text-teal-300 rounded-lg border border-slate-700 flex items-center gap-1.5 transition-colors">
                            <i class="fa-solid fa-map-location-dot"></i>
                            <span>Xem Google Maps</span>
                        </a>
                    </div>
                </div>
            `;
        }

        function selectPlanTab(plan) {
            activePlan = plan;
            document.querySelectorAll('.plan-tab').forEach(btn => {
                btn.classList.remove('bg-slate-700/50', 'text-emerald-400');
                btn.classList.add('text-slate-300');
            });
            const activeBtn = document.getElementById(`plan-${plan}`);
            activeBtn.classList.add('bg-slate-700/50', 'text-emerald-400');

            const labels = {
                '1N1D': 'Tạo Lịch Trình 1 Ngày 1 Đêm',
                '2N1D': 'Tạo Lịch Trình 2 Ngày 1 Đêm',
                '3N2D': 'Tạo Lịch Trình 3 Ngày 2 Đêm'
            };
            document.getElementById('planBtnLabel').innerText = labels[plan];
        }

        function getRandomItem(arr) {
            if (!arr || arr.length === 0) return null;
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateItineraryByPlan() {
            document.getElementById('singleResultView').classList.add('hidden');
            document.getElementById('itineraryResultView').classList.remove('hidden');
            document.getElementById('resultBadge').classList.remove('hidden');
            document.getElementById('resultActions').classList.remove('hidden');

            document.getElementById('resultTitle').innerText = `Gợi Ý Lịch Trình ${activePlan}`;

            const days = activePlan === '1N1D' ? 1 : activePlan === '2N1D' ? 2 : 3;
            let html = '';
            let exportText = `LỊCH TRÌNH DU LỊCH NINH BÌNH (${activePlan})\n\n`;

            for (let i = 1; i <= days; i++) {
                const khudiem1 = getRandomItem(DATABASE.khudiem) || FALLBACK_DATA.khudiem[0];
                const khudiem2 = getRandomItem(DATABASE.khudiem) || FALLBACK_DATA.khudiem[1];
                const nhahang = getRandomItem(DATABASE.nhahang) || FALLBACK_DATA.nhahang[0];
                const cafe = getRandomItem(DATABASE.cafe) || FALLBACK_DATA.cafe[0];
                const luutru = getRandomItem(DATABASE.luutru) || FALLBACK_DATA.luutru[0];

                exportText += `--- NGÀY ${i} ---\n- Sáng: ${khudiem1.name}\n- Trưa: ${nhahang.name}\n- Chiều: ${khudiem2.name} & Cafe tại ${cafe.name}\n- Nghỉ đêm: ${luutru.name}\n\n`;

                html += `
                    <div class="p-3.5 bg-slate-900/80 rounded-xl border border-slate-700/80 space-y-2">
                        <div class="font-bold text-emerald-400 text-xs uppercase tracking-wider flex justify-between">
                            <span>📅 Ngày ${i}</span>
                        </div>
                        <div class="text-xs space-y-1.5 text-slate-200">
                            <p><span class="text-amber-400 font-semibold">☀️ Sáng:</span> Tham quan <strong>${khudiem1.name}</strong></p>
                            <p><span class="text-orange-400 font-semibold">🍲 Trưa:</span> Thưởng thức đặc sản ở <strong>${nhahang.name}</strong></p>
                            <p><span class="text-teal-400 font-semibold">🌆 Chiều:</span> Khám phá <strong>${khudiem2.name}</strong> + Check-in <strong>${cafe.name}</strong></p>
                            <p><span class="text-indigo-400 font-semibold">🌙 Tối:</span> Nghỉ ngơi tại <strong>${luutru.name}</strong></p>
                        </div>
                    </div>
                `;
            }

            currentResultText = exportText;
            document.getElementById('itineraryResultView').innerHTML = html;
        }

        function generateItinerary() {
            selectPlanTab('1N1D');
            generateItineraryByPlan();
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.remove('bg-emerald-500', 'text-slate-950', 'font-semibold', 'shadow-md');
                tab.classList.add('text-slate-300');
            });

            const activeTab = document.getElementById(`tab-${mode}`);
            if (activeTab) {
                activeTab.classList.add('bg-emerald-500', 'text-slate-950', 'font-semibold', 'shadow-md');
                activeTab.classList.remove('text-slate-300');
            }

            updateCurrentList();
            drawWheel();
        }

        function copyResultToClipboard() {
            if (!currentResultText) return;
            
            // Clipboard fallback as per constraints
            const textarea = document.createElement('textarea');
            textarea.value = currentResultText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                const toast = document.getElementById('copyToast');
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2000);
            } catch (err) {
                console.error('Không thể copy', err);
            }
            document.body.removeChild(textarea);
        }

        // Window Event Listeners
        window.addEventListener('load', () => {
            initData();
            resizeCanvas();
        });

        window.addEventListener('resize', () => {
            resizeCanvas();
        });
    </script>
</body>
</html>
